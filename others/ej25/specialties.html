<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 25 - Tabla</title>
    <link rel="stylesheet" href="specialties.css">
    <script src="localStorage.js" defer></script>
    <script src="specialties.js" defer></script>
</head>

<body>
    <div class="wrapper">
        <header class="dashboard__header">
            <h1>Especialidades Médicas</h1>
            <p>Listado de especialidades disponibles</p>
        </header>
        <section class="specialties">
            <div class="specialties--add">
                <a href="specialty.html" class="add-btn">
                    Agregar especialidad
                </a>
            </div>
            <div class="search">
                <label for="search"> Buscar por nombre</label>
                <div class="search__group">
                    <input type="search" id="search" placeholder="Ej: Cardiology">
                    <button type="button" id="search-button">
                        Buscar
                    </button>
                </div>
            </div>
            <div class="table-container">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Descripción</th>
                        </tr>
                    </thead>
                    <tbody id="specialties-table-body">
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</body>

</html>
