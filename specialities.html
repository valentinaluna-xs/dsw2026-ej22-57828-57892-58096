<!DOCTYPE html> 
<html lang="es">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Admin - Especialidad - Listado</title>
   <link rel="stylesheet" href="specialities_style.css">
</head>
<body>
    <div class="Admin-layout">
      
        <main class="main-content">
            <div class="content-header">
                <div>
                    <h1>Directorio de Especialidades</h1>
                    <p>Administre las categorías médicas y servicios del hospital.</p>
                </div>
                <div class="header-actions">
                    <input type="text" id="searchInput" placeholder="Buscar especialidad...">
                    <a href="especialities-crear.html" class="btn-primary">+ Nueva Especialidad</a>
                </div>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre de la Especialidad</th>
                            <th>Descripción</th>
                            
                        </tr>

                    </thead>
                    <tbody id="Especialities-table-body">

                    </tbody>
                </table>
                <script>
                    const tbody = document.getElementById('Especialities-table-body');
                    fetch('specialties.json')
                    .then(respuesta => respuesta.json())
                .then(data => 
                {
                    data.forEach(item => 
                    {
                         const fila = document.createElement('tr');
                        fila.innerHTML = `
                        <td>${item.id}</td>
                        <td>${item.name}</td>
                        <td>${item.description}</td>`;
                             
                        tbody.appendChild(fila);
                    });
                 })
                 
                 .catch(error => console.error('Error al cargar el JSON:', error));
             
                </script>
            </div>
        </main>

    </div>         
<script src="especialities.js"></script>
</body>
</html>
